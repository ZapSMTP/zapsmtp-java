# Publishes com.zapsmtp:zapsmtp-java to Maven Central when a version tag
# (v0.1.0, v0.1.0-beta.1) is pushed: signed with the release GPG key and
# released once Central's checks pass. Secrets (set by the owner, never read
# by anyone else): MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (a Central
# Portal user token), GPG_PRIVATE_KEY / GPG_PASSPHRASE.
#
# The full test suite needs the shared conformance cases and spec of the
# ZapSMTP SDK monorepo and runs there before a release is exported here.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Tag matches the project version
        run: |
          v=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
          grep -q "VERSION = \"$v\"" src/main/java/com/zapsmtp/Version.java
      - name: Build, sign and publish
        run: mvn -B -P release -DskipTests -Djacoco.skip=true deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
